plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jiseong'
version = '0.0.1-SNAPSHOT'
description = 'HomeSense'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'


    // QueryDSL — OpenFeign 포크 (원조 querydsl은 유지보수 종료)
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // JWT — COM-SEC-02 (JwtTokenProvider)
    // Spring Boot 4는 Jackson 3을 쓰는데 jjwt는 아직 Jackson 3을 지원하지 않아 jjwt-jackson 대신 jjwt-gson 사용
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

    // BAT-CLC-01 — RealEstateApiCollector 커넥션 풀 구성용 (AWS SDK 등을 통해 전이 의존성으로는
    // 이미 들어와 있던 라이브러리라 버전만 고정해 명시적으로 선언)
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'

    // AWS SES — BAT-MAIL-01 (이메일 발송), AWS SDK v2 직접 사용
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:ses'

    // springdoc-openapi — Spring Boot 4 / Spring Framework 7 대응 3.x 계열 필요 (2.8.x는 Boot 3용)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2' // 컨텍스트 로드 테스트용 인메모리 DB (실제 스키마는 MariaDB, 테이블 정의서 8장 DDL 기준)
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testcontainers — @Tag("integration") 테스트 전용(예: BAT-LOD-01 dedup_hash UNIQUE 동시성 검증).
    // spring-boot-testcontainers만으로는 이 Spring Boot 버전에서 testcontainers-bom이 자동으로
    // 걸리지 않아 버전을 명시적으로 고정한다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
}

// integration 태그 테스트는 Docker가 필요해 기본 `test` 태스크에서는 제외한다 — 평소 개발 루프
// (./gradlew test)가 Docker 없이도 항상 돌아가야 하므로, 이 테스트들은 별도 `integrationTest`
// 태스크로만 실행한다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs @Tag("integration") tests (Testcontainers 등 Docker 필요)'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}

