# application.properties
spring.application.name=homesense

spring.profiles.active=local

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Seoul

# PORT
server.port=8080

# Redis 대기 상한 — 미설정이면 Lettuce 기본값(명령 60초, 연결 10초)이 적용돼, Redis가 죽지 않고 느려지기만
# 해도 요청 스레드가 그만큼 멈춘다. 검색 API는 매 요청 RegionCodePrefixResolver 버전 키를 읽고, 인증
# 필터(user:status)·@Cacheable도 같은 연결 팩토리를 쓴다. 로컬·운영의 정상 응답은 수 ms라 1초면 충분하다.
# 장애 중에는 한 요청이 Redis를 여러 번 부를 수 있다(필터 1회 + 캐시 조회·저장) — 2s에서 1s로 줄였다(2026-10-21).
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# SQL
# 앱 패키지는 com.jiseong.homesense다(예전 값 com.homesense는 아무 로거에도 맞지 않았다). 앱 코드에 DEBUG 로그 호출은 없다(2026-10-22).
logging.level.com.jiseong.homesense=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# COM-LOG-01
logging.structured.format.console=logstash
# 이메일·Bearer·JWT·token= 값을 메시지와 스택트레이스에서 함께 가린다(LogMaskingJsonMembersCustomizer).
logging.structured.json.customizer=com.jiseong.homesense.common.logging.LogMaskingJsonMembersCustomizer

# BAT-SCH-01
homesense.batch.scheduler.housing-types=APT

# BAT-ERR-01
homesense.batch.retry.backoff-minutes=1,5,30
homesense.batch.retry.max-total-wait-minutes=180

# BAT-USR-01 / 탈퇴 유예기간
# grace-days: 탈퇴 후 철회할 수 있는(그동안 파기되지 않는) 기간(일). @Min(1), 잘못된 값은 기동 시 실패.
# purge.cron: 05:00은 03:00에 시작하는 수집→알림→메일 체인과 겹치지 않게 잡은 값(KST).
homesense.withdrawal.grace-days=${WITHDRAWAL_GRACE_DAYS:7}
homesense.withdrawal.purge.enabled=${WITHDRAWAL_PURGE_ENABLED:true}
homesense.withdrawal.purge.cron=${WITHDRAWAL_PURGE_CRON:0 0 5 * * *}

# BAT-GEO-01 지오코딩(카카오 주소 검색, REST API 키 = KAKAO_API_KEY)
# daily-limit: 하루(KST) 호출 상한. 카카오 콘솔 [통계]>[쿼터]의 일일 한도보다 낮게 잡는다(러너와 03:00 런이 같이 센다).
# request-interval-millis: 호출 사이 최소 간격(100 = 초당 10건). not-found-retry-days: "주소 못 찾음" 단지를 다시 부르지 않는 기간.
homesense.geocoding.daily-limit=${GEOCODING_DAILY_LIMIT:10000}
homesense.geocoding.request-interval-millis=${GEOCODING_REQUEST_INTERVAL_MILLIS:100}
homesense.geocoding.not-found-retry-days=30
homesense.geocoding.scheduled-enabled=${GEOCODING_SCHEDULED_ENABLED:true}

# API-CPX-01 GET /api/complexes/map 마커 상한(넘으면 truncated=true)
homesense.complex.map.max-results=${COMPLEX_MAP_MAX_RESULTS:500}

# SVC-NTF-01 알림 이력(MY-04) 조회 기간 — 발생 후 N개월이 지난 알림은 목록에서 빠진다(데이터는 지우지 않음).
# MY-04 화면 안내 문구가 같은 값(프론트 HISTORY_RETENTION_MONTHS)을 쓴다 — 바꾸면 함께 바꾼다.
homesense.notification.history.retention-months=${NOTIFICATION_HISTORY_RETENTION_MONTHS:6}
