# application.properties
spring.application.name=homesense

spring.profiles.active=local

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Seoul

# PORT
server.port=8080

# SQL
logging.level.com.homesense=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# COM-LOG-01 — 콘솔 로그 레코드 전체(타임스탬프·레벨·로거명·메시지·key-value·스택트레이스)를 하나의
# JSON 오브젝트로 렌더링한다(Spring Boot 내장 구조화 로깅, 별도 인코더 라이브러리 불필요). AuditLogger가
# addKeyValue()로 붙이는 구조화 필드는 이 설정이 있어야 로그 수집기가 파싱 가능한 최상위 JSON 필드로
# 나온다 — 이 설정 없이 메시지 문자열만 JSON으로 만들면 그 앞뒤에 패턴 레이아웃(타임스탬프/레벨 접두사,
# 별도 줄의 스택트레이스)이 그대로 붙어 로그 라인 전체는 유효한 JSON이 되지 않는다(코드리뷰에서 지적됨).
logging.structured.format.console=logstash

# BAT-SCH-01
homesense.batch.scheduler.housing-types=APT

# BAT-ERR-01
homesense.batch.retry.backoff-minutes=1,5,30
homesense.batch.retry.max-total-wait-minutes=180
