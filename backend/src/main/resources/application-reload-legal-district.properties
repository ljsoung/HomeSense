# 법정동코드 재적재 러너 전용 프로필(LegalDistrictCodeReloadCommandLineRunner).
# 백필 러너와 같은 방식 — 웹 서버를 띄우지 않고, @Scheduled 파이프라인(수집 03:00, 파기 05:00)도 활성화하지
# 않는다. 러너가 끝나면 SpringApplication.exit로 종료 코드를 반환한다.
spring.main.web-application-type=none
homesense.scheduling.enabled=false
homesense.withdrawal.purge.enabled=false
