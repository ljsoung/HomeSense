# MariaDB 10.11
spring.datasource.url=jdbc:mariadb://localhost:3307/homesense?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# API KEYS
homesense.external.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY}
homesense.external.kakao.api-key=${KAKAO_API_KEY:}
homesense.external.aws.ses.access-key=${AWS_SES_ACCESS_KEY:}
homesense.external.aws.ses.secret-key=${AWS_SES_SECRET_KEY:}
# AUTH-03 — SES는 아직 프로덕션 액세스 승인 전(샌드박스)이라 로컬에서는 검증된 수신자에게만 실제
# 발송된다. sender-address는 SES에서 검증한 발신자여야 한다.
homesense.external.aws.ses.region=ap-northeast-2
homesense.external.aws.ses.sender-address=${AWS_SES_SENDER_ADDRESS:noreply@hmss.site}

# AUTH-03 — 비밀번호 재설정 링크가 가리킬 프론트엔드 오리진(Vite dev server).
homesense.frontend.base-url=http://localhost:5173

# JWT
homesense.security.jwt.secret=${JWT_SECRET}
homesense.security.jwt.access-token-validity=1800000
homesense.security.jwt.refresh-token-validity=1209600000

# BAT-USR-01 — 로컬 DB의 테스트 계정이 며칠 뒤 조용히 삭제되는 것을 막기 위해 자동 파기를 끈다.
homesense.withdrawal.purge.enabled=false
