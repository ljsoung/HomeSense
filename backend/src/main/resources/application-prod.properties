# application-prod.properties

spring.datasource.url=jdbc:mariadb://${DB_HOST}:3307/homesense?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
homesense.security.jwt.secret=${JWT_SECRET}
homesense.security.jwt.access-token-validity=1800000
homesense.security.jwt.refresh-token-validity=1209600000

# API KEYS
homesense.external.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY}
homesense.external.kakao.api-key=${KAKAO_API_KEY:}
homesense.external.aws.ses.access-key=${AWS_SES_ACCESS_KEY:}
homesense.external.aws.ses.secret-key=${AWS_SES_SECRET_KEY:}

# SQL
logging.level.com.homesense=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

#
server.error.include-stacktrace=never
server.error.include-message=never

# CORS
homesense.cors.allowed-origins=${FRONTEND_URL}
