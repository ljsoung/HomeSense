# 테스트 전용 설정 — 실제 스키마(MariaDB)는 테이블 정의서 8장 DDL 원문을 따르며,
# 여기서는 @SpringBootTest 컨텍스트 로딩만을 위해 인메모리 H2를 사용한다.
spring.datasource.url=jdbc:h2:mem:homesense;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none

# BAT-ERR-01 — RetryQueueManager가 빈 생성 시점에 backoffMinutes를 바로 역참조해 컨텍스트
# 로딩 테스트(HomeSenseApplicationTests)에서도 값이 있어야 한다. 운영값(application.properties)과 동일.
homesense.batch.retry.backoff-minutes=1,5,30
homesense.batch.retry.max-total-wait-minutes=180
