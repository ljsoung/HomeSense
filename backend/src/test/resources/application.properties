spring.datasource.url=jdbc:h2:mem:homesense;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none

# BAT-ERR-01
homesense.batch.retry.backoff-minutes=1,5,30
homesense.batch.retry.max-total-wait-minutes=180

# COM-CFG-01
homesense.external.data-go-kr.service-key=test-data-go-kr-service-key-for-context-loading-only

# COM-SEC-02
homesense.security.jwt.secret=test-jwt-secret-key-for-context-loading-only-0123456789
homesense.security.jwt.access-token-validity=1800000
homesense.security.jwt.refresh-token-validity=1209600000

# AUTH-03 — SesClientConfig/AwsSesProperties(@NotBlank)가 컨텍스트 로딩 시점에 바인딩되므로
# 전체 컨텍스트를 띄우는 테스트(HomeSenseApplicationTests, *MariaDbIT)가 전부 이 값을 필요로 한다.
homesense.external.aws.ses.region=ap-northeast-2
homesense.external.aws.ses.sender-address=test-sender@example.com
homesense.frontend.base-url=http://localhost:5173

# BAT-USR-01 — 컨텍스트가 뜨는 테스트에서 스케줄러가 등록되지 않게 기본은 끈다(파기 IT만 켠다).
homesense.withdrawal.purge.enabled=false
